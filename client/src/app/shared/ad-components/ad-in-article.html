<!-- In-article ad — auto-sizes, insert after every two content sections -->
<!-- Replace data-ad-slot with your real Google AdSense slot ID -->
<ins
  class="mt-ad-in-article adsbygoogle"
  style="display:block; text-align:center;"
  data-ad-layout="in-article"
  [attr.data-ad-client]="clientId()"
  [attr.data-ad-slot]="slot()"
  data-ad-format="auto"
  data-full-width-responsive="true"
></ins>
<div class="mt-ad-in-article__placeholder" aria-hidden="true">
  <i class="bi bi-megaphone mt-ad-placeholder__icon"></i>
  <span class="mt-ad-placeholder__label">Advertisement Space</span>
  <span class="mt-ad-placeholder__subtext">Google AdSense</span>
</div>
